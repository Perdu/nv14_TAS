[auto]
objective = "speedrun"
random-splice = true
# local auto mode
splice-search = "endpoint-auto"
runs = 5
rounds = 10

# splice-points = 4
# One splice point for every 100 frames of the run
splice-frames-per-point = 100
splice-radius = 30.0
splice-lookback = 40
splice-iterations = 10000

splice-repair-iterations = 1500
splice-repair-rounds = 4
splice-repair-anchors = 3
splice-repair-searches = 4

splice-frontier = 3

splice-exit-lookback = 120

endpoint-repair-steps = 0

seed = "random"
