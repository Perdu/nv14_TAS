[common]
workers = 8
simulate-enemies = false
color = true
# level-id = "00-0"
# ltm-postroll = 0

[auto]
iterations = 10000
runs = 0
beam = 64
max-retime = 3
objective = "speedrun"
# require-reference-gold = false
# max-extra-ticks = 80
# range = "0:555"
seed = "random"
repair-window = 6
repair-lookback = 192
lookahead = 3
max-alignment = 20
deterministic = true
repair-local-steps = 3000
repair-search-order = "random"
frame-ahead-repair-multiplier = 50
campaign-local-steps = 0
cheap-pulses = 96
position-tolerance = 3.0
velocity-tolerance = 0.75
all-input-repair = true
beam_repair_revisit_limit = 4
splice_repair_revisit_limit = 100
splice_plans_per_pair = 2
auxiliary_beam_seeds = 1
# endpoint-repair-steps = 32
endpoint-repair-steps = 0
endpoint-repair-lookback = 40
endpoint-iterations-per-frame = 500
# How much does the auto local mode use the auto algorithm or the local random modifications
endpoint-auto-mutation-share = 0.5
# Parameters to progressively switch to the local algorithm
progressive-refinement = false
refinement-share = 0.25
adaptive-refinement = true
refinement-polish = true
refinement-cycle = 128
refinement-chain-steps = 32
# Auto structural mutations: low (default, cheap), medium (adds larger rewrites),
# or high (adds costly physics-aligned crossover). Explicit list is also allowed:
# mutations = ["direction-flip", "gap-repair", "direction-simplify", "boundary-shift",
#              "jump-rewrite", "passage-rewrite", "state-crossover"]
# direction-flip: invert a long L/R hold; gap-repair: join short neutral gaps;
# direction-simplify: remove short reversals; boundary-shift: move a direction change;
# jump-rewrite: shift/remove jump pulses; passage-rewrite: change direction between jumps;
# state-crossover: splice donor routes where player physics states nearly match (costly).
mutations = "high"
clean-air-jumps = true

[local]
local-inputs = "direction"
target-frame = 121
range = ["15:121"]
objective = "min-distance"
target-object = "exit"
# target-point = [470.0, 432.0]
# x-window = "740:"
# y-window = "317:327"
# require-interaction = ["testdoor:0", "testdoor:1"]
# require-reference-interactions = false
# avoid-interaction = ["trapdoor:1"]
window = 4
passes = 4
restarts = 500
window-shape = "mixed"
window-order = "random"
window-span = 15
# windows-per-pass = 20
# jump-start-mutation = 2
# jump-length-mutation = 2
# immutable-jumps = ["21:start", "73:length", "105:both"]
# physics-prune = false
# minimum-improvement = 0.0
clean-air-jumps = true

[jump-pattern]
target-frame = 100
range = "50:90"
objective = "min-y"
# target-object = "exit"
# target-point = [470.0, 432.0]
# x-window = "740:"
# y-window = "317:327"
jumps = [2, 3]
jump-length = "1:"
minimum-gap = 1
top-results = 10
# fixed-jump-frames = [42, 73]

[multi-splicer]
search = "hybrid"
iterations = 10000
auto-stagnation-rounds = 5
local-stagnation-rounds = 20
lookback = 2
frontier = 3
# Number of candidates to save per splice on disk
save-frontier = 64
runs = 3
# Fast repair
merge-bests = true
# Cost-intensive repair
merge-repair-at-end = true
merge-repair-pairs = 48
merge-repair-window = 48
merge-repair-targets = 2
repair-iterations = 100000
merge-verbose = false
# how many rounds of local mode for 1 round of auto mode
hybrid-local-rounds = 5
hybrid-cycles = 8
hybrid-stagnation-cycles = 5
use-current-run = true
