# Defaults for the auto subcommand.
#
# The mode section allows short names: objective means auto-objective,
# runs means auto-runs, and require_reference_gold means
# auto-require-reference-gold.

[auto]
objective = "highscore"
require_reference_gold = true
iterations = 10000
beam = 64
max_retime = 3
workers = 8
runs = 0
# Stop normally after this many rounds without a new global best.
stagnation_runs = 20
# Uncomment both lines for restart-safe spot/pre-emptible campaigns.
# checkpoint = "auto-campaign.json"
# resume = true
seed = "random"
